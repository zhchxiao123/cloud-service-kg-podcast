name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          flake8 project/src project/tests --max-line-length=100 --extend-ignore=E203,W503

      - name: Format check with black
        run: |
          black --check project/src project/tests

      - name: Run tests
        run: |
          python -m pytest project/tests/ -v

      - name: Validate ontology consistency (if Protégé CLI available)
        run: |
          echo "TODO: add OWL reasoner consistency check via owlready2 or ROBOT"
        continue-on-error: true
