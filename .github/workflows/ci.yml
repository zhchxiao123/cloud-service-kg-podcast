name: CI

on:
  push:
    branches: [main]
    paths:
      - "project/**"
      - "requirements-ci.txt"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "project/**"
      - "requirements-ci.txt"
      - ".github/workflows/ci.yml"

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Lint with flake8
        run: flake8 project/src project/tests --max-line-length=100 --extend-ignore=E203,W503

      - name: Format check with black
        run: black --check project/src project/tests

      - name: Run tests
        run: python -m pytest project/tests/ -v
