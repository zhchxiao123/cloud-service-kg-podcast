site_name: 本体工程与知识图谱实战
site_url: https://zhchxiao123.github.io/cloud-service-kg-podcast
repo_url: https://github.com/zhchxiao123/cloud-service-kg-podcast
edit_uri: edit/main/docs/

theme:
  name: material
  language: zh
  palette:
    - scheme: default
      primary: indigo
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - 首页: index.md
  - 系列总方案: master-plan.md
  - 分发模板: distribution-template.md
  - 项目文档:
      - 云服务 KG: project/README.md
      - 评估报告: project/eval/README.md

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - tables
